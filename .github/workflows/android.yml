name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", "app/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "app/**", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Check the manifest offers HOME and Leanback
        run: |
          AAPT=$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt2
          $AAPT dump xmltree --file AndroidManifest.xml android/app/build/outputs/apk/debug/app-debug.apk > manifest.txt
          grep -q 'android.intent.category.HOME' manifest.txt
          grep -q 'android.intent.category.LEANBACK_LAUNCHER' manifest.txt
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/www/index.html'
          echo "manifest and web core ok"

      - uses: actions/upload-artifact@v4
        with:
          name: PnwHome-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
