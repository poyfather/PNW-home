name: Feature request
description: Suggest an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation, not the solution
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: fit
    attributes:
      label: Fit
      options:
        - label: This keeps the app free of ads, tracking and background services
          required: true
        - label: This works within the Tizen 4.0 engine constraints (ES5, flexbox, no CSS grid)
